plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.maestudio'
    compileSdk 34

    defaultConfig {
        applicationId "com.maestudio"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Llave fija para que cada APK pueda instalarse encima del anterior sin
    // desinstalar (desinstalar borra el log). Viene de los secretos de GitHub.
    def stableKeystore = System.getenv('MAESTUDIO_KEYSTORE')
    signingConfigs {
        stable {
            if (stableKeystore) {
                storeFile file(stableKeystore)
                storePassword System.getenv('MAESTUDIO_STORE_PASSWORD')
                keyAlias System.getenv('MAESTUDIO_KEY_ALIAS')
                keyPassword System.getenv('MAESTUDIO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (stableKeystore) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
