name: Build APK

on:
  push:
    branches: [ main, 'mejoras-**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MAESTUDIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maestudio.keystore"
            echo "MAESTUDIO_KEYSTORE=$RUNNER_TEMP/maestudio.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta MAESTUDIO_KEYSTORE_BASE64: el APK no podra instalarse sobre el anterior."
          fi

      - name: Build debug APK
        env:
          MAESTUDIO_STORE_PASSWORD: ${{ secrets.MAESTUDIO_STORE_PASSWORD }}
          MAESTUDIO_KEY_ALIAS: ${{ secrets.MAESTUDIO_KEY_ALIAS }}
          MAESTUDIO_KEY_PASSWORD: ${{ secrets.MAESTUDIO_KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAEStudio-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
